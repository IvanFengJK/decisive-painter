# Checks every pull request and every push to main. Deploys are not done here: Vercel's Git integration already
# builds a preview for each branch and production for main (project kev-paint, root directory web/).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Ruff (harness/)
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.0"

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No npm install: the tests use node's built-in runner and import web/ directly.
      - name: Director, field, Impasto, guardrail and share-link tests
        run: node --test tests/*.test.mjs

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - run: pip install -r harness/requirements.txt
      - name: Render the example with both renderers
        run: |
          python harness/render_decisions.py harness/example-decisions.json example.png
          python harness/render_decisions.py harness/example-decisions.json frozen.png --frozen

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs; allow them rather than
      # running Chrome with --no-sandbox.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Headless browser checks (first load, determinism, share links)
        run: node tests/browser.mjs quick
        env:
          CHROME: /usr/bin/google-chrome
          # Shared 2-vCPU runners blow the 100 ms long-task budget on a cold start; log those numbers, don't fail on them.
          PERF_REPORT_ONLY: "1"
      - name: Keep screenshots and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-out
          path: out/
          retention-days: 7
